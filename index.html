<style>

.go.alt{background:var(--coral);color:var(--navy)}.go[disabled]{opacity:.35}
.row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.big{display:flex;justify-content:center}

.learn{background:var(--sky);border-radius:16px;padding:10px 18px;font-size:19px}
.mt{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:700px){.mt{grid-template-columns:1fr}}
.s{display:block;width:100%;text-align:left;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:10px 14px;font-size:clamp(17px,2.2vw,21px);margin-bottom:8px}
.s.sel{background:var(--sun)}.s.done{background:#8FE3CF}.s b{color:var(--coral)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.t{border:3px solid var(--navy);background:#fff;border-radius:16px;padding:8px;color:var(--navy);font-weight:700;font-size:20px}
.t.done{opacity:.35}.t.shake{animation:shake .4s;background:#FFB4A2}
.cz{display:grid;grid-template-columns:40px repeat(3,1fr);gap:8px;align-items:center}.cz .o{padding:6px 10px;justify-content:flex-start;border-color:transparent;font-size:clamp(17px,2.2vw,22px)}.cz .o.sel{border-color:var(--navy)}
.dot{width:26px;height:16px;border:3px solid var(--navy);border-radius:50%;background:#fff;flex:none}.sel .dot{background:var(--navy)}
.credit{text-align:right;font-size:15px}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tl{border:3px solid var(--navy);border-radius:18px;padding:10px 6px;color:var(--navy);font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}.tl.seen{background:var(--navy);color:var(--cream)}.say{background:var(--navy);color:var(--cream);border-radius:18px;padding:12px 20px;font-size:23px;min-height:30px}.pings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.pg{border:0;border-radius:18px;padding:16px;font-size:22px;font-weight:700;color:var(--navy)}.ex{border:0;border-radius:20px;padding:22px 14px;font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--navy);display:flex;flex-direction:column;gap:6px;align-items:center}.ex small{font-size:17px;font-weight:400}.ex.seen{outline:5px solid var(--teal)}.dl{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:6px}.ln{display:block;text-align:left;border:0;border-radius:16px;padding:8px 14px;font-size:clamp(16px,2.1vw,20px);color:var(--navy);max-width:85%}.ln b{display:block;font-size:14px;opacity:.75}.ln.F{background:#9FD8FF;align-self:flex-start}.ln.M{background:#FFB4A2;align-self:flex-end}.ln.hl{outline:4px solid var(--sun)}</style></head><body>

<script>
const ic=(k,s=56)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-'+k+'"/></svg>';
const N=a=>a.map(t=>({t}));
const L=[['Frank','Are you ready for our trip, Majid?'],['Majid','Of course!'],['Frank','I’m going to take a small rucksack with my camera, my wallet, some water ...'],['Majid','Good idea. I’ll take a small bag, too.'],['Frank','Then, in my suitcase I’m going to take sweatshirts and jeans, a raincoat ...'],['Majid','Er ... I’ll take the same clothes as you.'],['Frank','Are you going to take an umbrella?'],['Majid','No. I don’t have one.'],['Frank','Don’t worry. I’ll take one. We can share it.'],['Majid','OK. Cool. What do I need to bring in my washbag?'],['Frank','Bring your toothbrush. I’ll bring toothpaste, soap and shampoo. We can share those.'],['Majid','Good plan!'],['Frank','Don’t forget the most important thing, Majid.'],['Majid','Er, a friend like you!'],['Frank','Ha ha! Yes, but I was thinking about your passport.'],['Majid','Of course! I’ll go home and look for that now.'],['Frank','Majid! Are you sure you’re ready for this trip? Are you excited?'],['Majid','Yes! Because we’re going to visit London and practise our English.'],['Frank','I’ll download a guidebook about the city.'],['Majid','Thanks for your help. I’ll get some sweets for the plane!']];
const X=[['Of course!','#F5B700','Do you have your passport? — Of course!'],['Good plan!','#8FE3CF','I’m going to take a pillow. — Good plan!'],['Thanks for your help.','#FFB4A2','There! Now you’re ready. — Thanks for your help.']];
const A=[
{n:'1 · Spell it',min:3,type:'mc',q:[{p:'suitcase',w:'suitcase',pr:'Listen and choose the correct spelling.',o:N(['sutecase','suitcase','suitcace']),a:1},{p:'passport',w:'passport',pr:'Listen and choose the correct spelling.',o:N(['pasport','pasaport','passport']),a:2},{p:'raincoat',w:'raincoat',pr:'Listen and choose the correct spelling.',o:N(['raincoat','raincote','ranecoat']),a:0},{p:'toothbrush',w:'toothbrush',pr:'Listen and choose the correct spelling.',o:N(['toothbrash','tuthbrush','toothbrush']),a:2}]},
{n:'2 · Expressions',min:3,type:'expr'},
{n:'3 · Listen & read',min:4,type:'dlg'},
{n:'4 · True or false',min:3,type:'mc',q:[
{pr:'They are going to take suitcases only.',o:N(['True','False']),a:1,ex:'Frank takes a rucksack and a suitcase. Majid takes a small bag.'},
{pr:'They are going to share an umbrella.',o:N(['True','False']),a:0,ex:'Frank: “I’ll take one. We can share it.”'},
{pr:'Majid has his passport now.',o:N(['True','False']),a:1,ex:'He will go home and look for it.'},
{pr:'They are going to buy a guidebook.',o:N(['True','False']),a:1,ex:'Frank will download a guidebook.'},
{pr:'Frank is going to take a camera on the trip.',o:N(['True','False']),a:0,ex:'He is going to take a rucksack with his camera in it.'},
{pr:'Majid knows they are going to visit London.',o:N(['True','False']),a:0,ex:'Majid: “We’re going to visit London.”'}]},
{n:'5 · Questions',min:4,type:'mc',q:[
{pr:'Who’s going to take a small rucksack?',o:N(['Frank','Majid','Frank and Majid']),a:0},
{pr:'Does Majid need to take toothpaste, soap and shampoo? Why?',o:N(['No, he doesn’t. Frank is going to take them and they can share them.','Yes, he does. He has no soap.','No, he doesn’t. He has a washbag.']),a:0},
{pr:'Does Majid have his passport?',o:N(['Yes, he does.','No, he doesn’t. He’ll go home and look for it.','No, he doesn’t. Frank has it.']),a:1},
{pr:'Who will get some sweets?',o:N(['Frank','Majid','Their friends']),a:1},
{pr:'How are they going to get there?',o:N(['By plane.','By bus.','By train.']),a:0},
{pr:'Who’s ready for the trip?',o:N(['Majid is ready.','Frank is ready.','They are both ready.']),a:1}]},
{n:'6 · Act it out',min:3,type:'mc',q:[
{pr:'A: “I’m going to take a pillow so I can sleep on the bus.”<br>B: “___”',o:N(['Of course!','Good plan!','Thanks for your help.']),a:1},
{pr:'A: “Do you have your passport?”<br>B: “___ It’s in my bag.”',o:N(['Good plan!','Thanks for your help.','Of course!']),a:2},
{pr:'A: “There! Now you’re ready.”<br>B: “___”',o:N(['Thanks for your help.','Of course!','Good plan!']),a:0},
{pr:'A: “I’ll take an umbrella. We can share it.”<br>B: “___”',o:N(['Thanks for your help.','Good plan!','Of course!']),a:1},
{pr:'A: “Can I borrow your charger?”<br>B: “___”',o:N(['Of course!','Good plan!','Thanks for your help.']),a:0}]},
{n:'7 · Final task',min:5,type:'cloze'}];
const C={t:'Frank and Majid are going on a trip to {0} (1). Frank is going to take a small {1} (2) with his camera in it. Frank will take one {2} (3) and they can share it. Majid must look for his {3} (4) at home. They are going to get there by {4} (5). They are very excited!',o:[['Paris','London','Dubai'],['rucksack','pillow','raincoat'],['pillow','guidebook','umbrella'],['raincoat','passport','charger'],['bus','train','plane']],a:[1,0,2,1,2]};
let S={step:0,st:A.map(()=>({i:0,pk:null,sc:0,done:false,seen:{},hl:null,dq:null,ans:{},chk:false}))};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t,p){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;u.pitch=p||1;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784],.12,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function lis(){const q=A[S.step].q[S.st[S.step].i];say(q.w)}
function pick(i){const s=S.st[S.step],a=A[S.step],q=a.q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();if(q.w)say(q.w);else if(!q.ex)say(q.o[q.a].t);render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]={i:0,pk:null,sc:0,done:false,seen:{},hl:null,dq:null,ans:{},chk:false};tone([440,523],.1);render()}
function ex(k){const s=S.st[1];s.seen[k]=1;tone([660,880],.12);say(X[k][0].replace('!','')) ;render()}
function line(i){S.st[2].hl=i;say(L[i][1],L[i][0]==='Frank'?.8:1.4);render()}
function play(){try{speechSynthesis.cancel();L.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang='en-GB';u.rate=.9;u.pitch=l[0]==='Frank'?.8:1.4;u.onstart=()=>{S.st[2].hl=i;render()};speechSynthesis.speak(u)})}catch(e){}}
function dq(i){const s=S.st[2];if(s.dq!==null)return;s.dq=i;i===0?GOOD():BAD();render()}
function cl(g,i){const s=S.st[6];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[6];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s[0].sc+s[3].sc+s[4].sc+s[5].sc+Object.keys(s[1].seen).length+(s[6].chk?C.a.filter((a,g)=>s[6].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="q" style="text-align:center;font-size:56px;color:#E8553D">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<6?'<button class="go" onclick="go('+(S.step+1)+')">Next part →</button>':'')+'</div></div>';
 const pic=q.p?'<div class="big">'+ic(q.p,120)+'</div>'+(q.w?'<div class="row" style="justify-content:center"><button class="go alt" onclick="lis()">Listen</button></div>':''):'';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div>'+pic+'<div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+o.t+'</button>').join('')+'</div><div class="fb">'+(lk?(ok?'Great job! ':'Not quite. ')+'The answer is: '+q.o[q.a].t+'. '+(q.ex||''):'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
